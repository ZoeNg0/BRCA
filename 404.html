<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — PPP4C in Breast Cancer</title>

  <!-- Styles are inlined on purpose. GitHub Pages serves this file for ANY
       unknown path, including deep ones like /BRCA/a/b/c, where a relative
       stylesheet link would resolve to the wrong folder and load nothing. -->
  <style>
    :root {
      color-scheme: light;
      --page: #f5f2e7; --ink: #26371f; --muted: #43593a;
      --accent: #456337; --accent-hover: #a8446a;
      --on-accent: #fcfaf4; --on-hover: #fcfaf4;
      --border: rgba(38,55,31,0.13);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #1a1e15; --ink: #f2f0e4; --muted: #c6ccb4;
        --accent: #a5b68d; --accent-hover: #e9a7b8;
        --on-accent: #1a1e15; --on-hover: #1a1e15;
        --border: rgba(240,226,224,0.14);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 46ch; text-align: center; }
    .code {
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 0.75rem;
    }
    h1 {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: clamp(2rem, 1.6rem + 1.8vw, 3rem);
      line-height: 1.15; letter-spacing: -0.012em; margin: 0 0 1rem;
    }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a.btn {
      display: inline-block; padding: 0.7rem 1.4rem;
      background: var(--accent); color: var(--on-accent);
      border-radius: 8px; text-decoration: none; font-weight: 550;
    }
    a.btn:hover { background: var(--accent-hover); color: var(--on-hover); }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>That page does not exist</h1>
    <p>The link may be out of date, or the page may have been renamed while the project was being written.</p>
    <!-- If you rename the repository or add a custom domain, update this href. -->
    <a class="btn" href="/BRCA/">Back to the overview</a>
  </main>
</body>
</html>
